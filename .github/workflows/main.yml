name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Otomatis update tiap 12 jam
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generate Pacman-style contribution grid
      - name: generate github-contribution-grid-pacman.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-pacman.svg?color_snake=#EF93C4&color_dots=#1A1020,#301B3F,#46255E,#B8528E,#E377B2
            dist/github-contribution-grid-pacman-dark.svg?palette=github-dark&color_snake=#EF93C4

      # Push SVG files to output branch
      - name: push github-contribution-grid-pacman.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
